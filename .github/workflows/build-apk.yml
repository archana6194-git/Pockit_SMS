name: Build Pockit APK
on:
  workflow_dispatch:
  push:
    branches: [main]
env:
  APP_ID: com.example.pockit
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Create Capacitor Android project
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init Pockit "$APP_ID" --web-dir=www
          npx cap add android
      - name: Add SMS plugin, permissions and receiver
        run: python3 .github/add_sms.py
      - name: Sync web files
        run: npx cap sync android
      - name: Build APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android && chmod +x gradlew
          if [ -n "$KS_B64" ]; then
            ./gradlew assembleRelease
            echo "$KS_B64" | base64 -d > ../ks.jks
            BT="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)"
            "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk ../aligned.apk
            "$BT/apksigner" sign --ks ../ks.jks --ks-pass "pass:$KS_PASS" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" --out ../Pockit.apk ../aligned.apk
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../Pockit.apk
          fi
      - uses: actions/upload-artifact@v4
        with: { name: Pockit-APK, path: Pockit.apk }
