<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#8ec5ff"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Pockit">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pockit – Expense Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f2ff;--card:rgba(255,255,255,.76);--tx:#2f4268;--mu:#7f93b8;--cr:#3fb59a;--db:#ee8aa3;--ac1:#8ec5ff;--ac2:#b8b5ff;--ac3:#ffd6a5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-theme=cotton]{--bg:#fff4ea;--card:rgba(255,255,255,.85);--tx:#2d2250;--mu:#8a7fae;--cr:#12b886;--db:#f0457a;--ac1:#b57cff;--ac2:#ff7eb6}
[data-theme=lofi]{--bg:#f1eafc;--card:rgba(255,255,255,.72);--tx:#4a3f6b;--mu:#9588b8;--cr:#4fb58f;--db:#ec8aa5;--ac1:#b9a2f5;--ac2:#f7a8c8;--ac3:#ffc9a3}
[data-theme=lofi] .btn,[data-theme=lofi] .fab,[data-theme=lofi] #toast,[data-theme=lofi] .tog .db.on{color:#3d3160}
[data-theme=lofi] .mini[style*=gradient]{color:#3d3160!important}
[data-theme=lofi] .card,[data-theme=lofi] .mini{box-shadow:0 8px 24px rgba(155,130,205,.18)}
[data-theme=lofi] .fab{box-shadow:0 8px 22px rgba(247,168,200,.55)}
[data-theme=midnight] .btn,[data-theme=midnight] .fab,[data-theme=midnight] #toast,[data-theme=midnight] .tog .db.on{color:#1f3157}
[data-theme=midnight] .mini[style*=gradient]{color:#1f3157!important}
[data-theme=midnight] .card,[data-theme=midnight] .mini{box-shadow:0 8px 24px rgba(110,150,210,.2)}
[data-theme=midnight] .fab{box-shadow:0 8px 22px rgba(142,197,255,.6)}
[data-theme=mint]{--bg:#e8fff6;--card:rgba(255,255,255,.85);--tx:#12324a;--mu:#5d8a96;--cr:#0ca678;--db:#e8590c;--ac1:#20c997;--ac2:#4cc9f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:'Quicksand',ui-rounded,system-ui,sans-serif;font-weight:600}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
#main{flex:1;overflow-y:auto;padding:14px 16px 110px}
h1,h2,h3{margin:0;font-weight:900}h2{font-size:20px}h3{font-size:16px}
.hero{border-radius:24px;padding:16px;margin-bottom:12px;background:linear-gradient(135deg,var(--ac1),var(--ac2));color:var(--tx);box-shadow:0 8px 24px rgba(0,0,0,.12)}.hero .big{font-size:34px}
.hs{flex:1;background:rgba(255,255,255,.5);border-radius:14px;padding:8px 10px;font-size:12px}.hs b{display:block;font-size:16px}
.pills{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}.pill{flex:none;display:inline-flex;align-items:center;gap:4px;padding:6px 11px;border-radius:20px;background:var(--card);font-size:13px;font-weight:800;white-space:nowrap;border:0;color:var(--tx);font-family:inherit}.pill.db{color:var(--db)}.pill.warn{color:#d9822b}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}.lg{font-size:13px;margin:5px 0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.tile{background:var(--card);border-radius:18px;padding:10px;text-align:center;font-size:12px;color:var(--mu)}.tile b{display:block;font-size:16px;color:var(--tx);margin-top:2px}.tile .e{font-size:20px}
.act2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.act2 button{border:0;border-radius:18px;padding:14px 8px;font:inherit;font-weight:900;font-size:15px;background:var(--card);color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:4px}.act2 button span{font-size:26px}.act2 .pr{background:linear-gradient(135deg,var(--ac1),var(--ac2))}
.card{background:var(--card);backdrop-filter:blur(14px);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.mu{color:var(--mu);font-size:13px}.cr{color:var(--cr)}.db{color:var(--db)}
.big{font-size:40px;font-weight:900;letter-spacing:-1px}
.grid3{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;margin-bottom:14px}
.mini{background:var(--card);border-radius:20px;padding:12px 8px;text-align:center}
.mini b{display:block;font-size:17px;font-weight:900;margin-top:2px}
.btn{border:0;border-radius:18px;padding:14px 18px;font:inherit;font-weight:900;font-size:16px;color:#fff;background:linear-gradient(135deg,var(--ac1),var(--ac2));width:100%}
.btn.ghost{background:var(--card);color:var(--tx)}.btn.red{background:var(--db)}
.nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:var(--bg);border-top:1px solid var(--card);padding:8px 4px 8px}
.nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button span{font-size:19px}.nav .on{color:var(--tx)}.nav .on span{transform:scale(1.2)}
.fab{position:absolute;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;border:0;font-size:34px;color:#fff;background:linear-gradient(135deg,var(--ac1),var(--ac2));box-shadow:0 8px 24px rgba(255,79,163,.5);z-index:5}
.fab:active{transform:scale(.9) rotate(90deg)}
.fab.mic{width:50px;height:50px;font-size:22px;right:24px;bottom:calc(148px + env(safe-area-inset-bottom,0px))}.fab.mic:active{transform:scale(.9)}
.ent{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:15px}.ent .mu{font-size:12px}
.ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex:none}
.ent .g{flex:1;min-width:0}.ent .g div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input,select{width:100%;background:var(--card);border:2px solid transparent;border-radius:16px;padding:13px;font:inherit;font-weight:800;color:var(--tx);margin-top:6px}
input:focus,select:focus{outline:none;border-color:var(--ac1)}
label{display:block;margin:12px 0 0;font-size:13px;color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:2px solid transparent;background:var(--card);color:var(--tx);border-radius:30px;padding:8px 12px;font:inherit;font-weight:800;font-size:14px}
.chip.on{border-color:var(--ac2);background:rgba(255,79,163,.18)}
.tog{display:flex;background:var(--card);border-radius:20px;padding:4px}
.tog button{flex:1;border:0;border-radius:16px;padding:12px;font:inherit;font-weight:900;font-size:16px;background:none;color:var(--mu)}
.tog .cr.on{background:var(--cr);color:#06271d}.tog .db.on{background:var(--db);color:#fff}
#amt{font-size:44px;text-align:center;font-weight:900}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:90%;overflow-y:auto;background:var(--bg);border-radius:30px 30px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));z-index:21;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1)}
#sheet.up{transform:none}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-150%);background:linear-gradient(135deg,var(--ac1),var(--ac2));color:#fff;padding:12px 18px;border-radius:20px;font-weight:900;z-index:30;width:max-content;max-width:90%;text-align:center;transition:transform .35s cubic-bezier(.2,1.4,.4,1)}
#toast.show{transform:translate(-50%,0)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .d{aspect-ratio:1/1.1;border-radius:14px;background:var(--card);padding:4px 0;font-size:13px;font-weight:800;border:0;color:var(--tx);font-family:inherit}
.cal .d small{display:block;font-size:9.5px;font-weight:900}.cal .d.today{outline:2px solid var(--ac2)}.cal .d.e{background:none}
.bar{height:12px;border-radius:8px;background:var(--card);overflow:hidden}.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--cr),var(--ac3))}
.pig{font-size:52px;display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-5deg)}}
@media(prefers-reduced-motion:reduce){.pig{animation:none}#sheet{transition:none}}
.sw{overflow-x:auto}svg{max-width:100%}
#wr{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);color:#fff}
.wrs{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory}
.wc{flex:none;width:100%;scroll-snap-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 28px;gap:12px}
.wc .n{font-size:58px;font-weight:900;line-height:1.05}.wc .e{font-size:84px}.wc p{margin:0;font-size:18px}
.wx{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px;z-index:41;border:0;border-radius:50%;width:40px;height:40px;font-size:18px;background:rgba(0,0,0,.35);color:#fff}
.wc .btn{background:#fff;color:#2d2250;max-width:260px}
.swr{position:relative;overflow:hidden;border-radius:16px;margin-bottom:6px}
.swb{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-weight:900;color:#fff;background:linear-gradient(90deg,var(--ac1) 50%,var(--db) 50%)}
.swf{position:relative;background:var(--bg);padding:0 10px;touch-action:pan-y;border-bottom:1px solid var(--card)}
.ff{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ff label{margin:0}.ff select,.ff input{margin-top:0}
#lk,#wl{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
.dots{display:flex;gap:14px;margin:4px 0 8px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mu)}.dots i.f{background:linear-gradient(135deg,var(--ac1),var(--ac2));border-color:transparent}
.pad{display:grid;grid-template-columns:repeat(3,74px);gap:14px}.pad button{height:74px;border-radius:50%;border:0;font:inherit;font-size:28px;font-weight:900;background:var(--card);color:var(--tx)}.pad button:active{transform:scale(.92)}
details>summary{list-style:none;cursor:pointer;font-weight:900;font-size:17px}details>summary::-webkit-details-marker{display:none}details>summary::after{content:'▾';float:right;color:var(--mu)}details[open]>summary::after{content:'▴'}
details.grp{margin-bottom:8px}details.grp>summary{font-size:18px;padding:10px 4px}
.shk{animation:shk .35s}@keyframes shk{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
</style>
</head>
<body>
<div id="app"><div id="main"></div><button class="fab" id="fab" onclick="addMenu()" aria-label="Add entry">+</button><button class="fab mic" id="mic" onclick="voiceStart()" aria-label="Speak an entry">🎤</button>
<nav class="nav" id="nav"></nav></div>
<div id="shade" onclick="closeSheet()"></div><div id="sheet"></div><div id="toast"></div>
<script>
const CATS=[['Food','🍕','#ff9f43'],['Travel','🚌','#4cc9f0'],['Shopping','🛍️','#ff5fa2'],['Bills','💡','#ffd23f'],['Health','💊','#3ee6b0'],['Salary','💰','#34d399'],['Other','✨','#a78bfa']];
const THEMES=[['midnight','Baby Blue'],['cotton','Cotton Candy'],['lofi','Pastel Dream'],['mint','Mint Fresh']];
const PM=['Cash','UPI','Card','Bank'];
const DEB=['Oh no, not again! 😭 {a} just left the chat.','And just like that, {a} said bye-bye 👋 It didn’t even text back.','Your wallet felt a disturbance in the force 😮‍💨 -{a}','Another one bites the dust 🎶 -{a} gone.','Swipe now, cry later 💳😂 -{a}','Was it worth it? Be honest. 👀 -{a}'];
const CRE=['Cha-ching!! 🤑 +{a} just slid in. Act cool.','Money has entered the chat 💸 and it’s staying this time. Hopefully.','+{a} incoming! Your wallet is doing a happy dance 💃'];
const BIG='Excuse me?? 😳 That was a BIG one. Blink twice if you were hacked.';
const GEN=['Logged ✅ {a} noted.','Got it. -{a} recorded 🌿','Saved! Every entry helps you see the bigger picture 💛'];
const UNH=['{a} GONE. Funeral at dawn. Bring snacks (you can’t afford them) 🪦','Your bank balance just screamed. I heard it. -{a} 💀','-{a}?! The audacity. The nerve. The receipt. 🧾🔥'];
function pool(){return S.sass==='gentle'?GEN:S.sass==='unhinged'?DEB.concat(UNH):DEB}
let S=load(),tab='home',M=new Date(),sel=null;M.setDate(1);
function def(){return{tx:[],bills:[],cur:'₹',theme:'midnight',budget:0,big:5000,sass:'spicy',cats:CATS.map(c=>c.slice()),rt:[],income:0,cb:{},fr:[],sp:[],st:[],name:''}}
function load(){try{return Object.assign(def(),JSON.parse(localStorage.getItem('pp1')||'{}'))}catch(e){return def()}}
function save(){try{localStorage.setItem('pp1',JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s),pick=a=>a[Math.floor(Math.random()*a.length)];
const money=n=>S.cur+Math.abs(Math.round(n)).toLocaleString('en-IN');
const cat=n=>CATS.find(c=>c[0]===n)||CATS.find(c=>c[0]==='Other')||CATS[0];
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const dkey=d=>key(d)+'-'+String(d.getDate()).padStart(2,'0');
const inM=(t,m)=>key(new Date(t.ts))===key(m);
const sum=(a,ty)=>a.filter(t=>t.type===ty&&!t.xf).reduce((s,t)=>s+t.amt,0);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove('show'),2800)}
function openSheet(h){$('#sheet').innerHTML=h;$('#shade').style.display='block';requestAnimationFrame(()=>$('#sheet').classList.add('up'))}
function closeSheet(){PI=null;if(REC)try{REC.abort()}catch(e){}$('#sheet').classList.remove('up');$('#shade').style.display='none'}
function setTab(t){if(t==='bills'||t==='settings'){more=t;t='more'}else if(t==='calendar'){act='cal';t='activity'}else if(t==='all'){act='list';t='activity'}tab=t;render()}
function shift(n){M=new Date(M.getFullYear(),M.getMonth()+n,1);render()}
function monthBar(){return`<div class="row sp" style="margin-bottom:12px"><button class="pill" onclick="shift(-1)">‹</button><b style="font-size:17px">${M.toLocaleString('en',{month:'long',year:'numeric'})}</b><button class="pill" onclick="shift(1)">›</button></div>`}
function greet(){const h=new Date().getHours(),n=S.name?esc(S.name):'';return h<12?(n?'Good morning, '+n+' ☀️':'Good morning, money boss ☀️'):h<17?(n?n+', afternoon slump? Don’t online shop 🛒':'Afternoon slump? Don’t online shop 🛒'):h<22?(n?'Evening check-in, '+n+' 🌆':'Evening check-in, bestie 🌆'):(n?n+', your wallet is sleeping. Don’t wake it 🌙':'Late night? Your wallet is sleeping, don’t wake it 🌙')}
function welcome(){const o=document.createElement('div');o.id='wl';o.style.zIndex=50;o.innerHTML='<div class="pig">'+logo(88)+'</div><h2>Hey you! 👋</h2><div class="mu" style="text-align:center">Ready to find out where your money disappears?<br>What should we call you?</div><input id="wn" maxlength="20" placeholder="Your name" style="max-width:280px;text-align:center;font-size:20px"><button class="btn" id="wg" style="max-width:280px">Let’s go</button><button class="chip" id="wk">Skip for now</button>';document.body.appendChild(o);
const go=sk=>{const v=sk?'':$('#wn').value.trim();S.name=v;S.ws=1;save();o.remove();render();if(v)toast('Nice to meet you, '+v+' 🎉')};
o.querySelector('#wg').onclick=()=>go(false);o.querySelector('#wk').onclick=()=>go(true);o.querySelector('#wn').onkeydown=e=>{if(e.key==='Enter')go(false)}}
function entRow(t,tm){const c=cat(t.cat),d=new Date(t.ts);return`<div class="ent" onclick="openEntry('${t.id}')"><div class="ico" style="background:${c[2]}33">${c[1]}</div><div class="g"><div>${esc(t.reason||c[0])}</div><div class="mu">${tm?d.toLocaleTimeString('en',{hour:'numeric',minute:'2-digit'}):d.toLocaleString('en',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}${t.pm?' • '+t.pm:''}</div></div><b class="${t.type==='cr'?'cr':'db'}">${t.type==='cr'?'+':'-'}${money(t.amt)}</b></div>`}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function donut(items,tot){if(!tot)return'';let o=0,r=46,C=2*Math.PI*r;const arcs=items.map(([n,v])=>{const l=v/tot*C,s=`<circle r="${r}" cx="60" cy="60" fill="none" stroke="${cat(n)[2]}" stroke-width="18" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}" transform="rotate(-90 60 60)"/>`;o+=l;return s}).join('');return`<div class="row" style="gap:14px"><svg width="120" height="120" viewBox="0 0 120 120" style="flex:none">${arcs}<text x="60" y="58" text-anchor="middle" fill="currentColor" font-size="10" opacity=".6">Spent</text><text x="60" y="74" text-anchor="middle" fill="currentColor" font-weight="900" font-size="15">${km(tot)}</text></svg><div style="flex:1;min-width:0">${items.map(([n,v])=>`<div class="row sp lg"><span class="row" style="gap:6px;min-width:0"><i class="sw" style="background:${cat(n)[2]}"></i>${cat(n)[1]} ${esc(n)}</span><span><b>${km(v)}</b> <span class="mu">${Math.round(v/tot*100)}%</span></span></div>`).join('')}</div></div>`}
function byCat(a){const m={};a.filter(t=>t.type==='db'&&!t.xf).forEach(t=>m[t.cat]=(m[t.cat]||0)+t.amt);return Object.entries(m).sort((x,y)=>y[1]-x[1])}
function carry(m){const end=new Date(m.getFullYear(),m.getMonth()+1,1).getTime();return S.tx.filter(t=>t.ts<end).reduce((s,t)=>s+(t.type==='cr'?t.amt:-t.amt),0)}
function home(){const a=S.tx.filter(t=>inM(t,M)),cr=sum(a,'cr'),db=sum(a,'db'),bal=carry(M),td=dkey(new Date()),today=S.tx.filter(t=>dkey(new Date(t.ts))===td).sort((x,y)=>y.ts-x.ts),h=new Date().getHours(),st=streak();
return`<div class="row sp" style="margin-bottom:12px"><div class="row" style="gap:10px">${logo(38)}<div><div class="mu" style="font-weight:700">${h<12?'Good morning':h<17?'Good afternoon':'Good evening'}${S.name?',':''}</div><b style="font-size:18px">${S.name?esc(S.name):'Pockit'}</b></div></div>${st?`<span class="pill">🔥 ${st} day${st>1?'s':''}</span>`:''}</div>${monthBar()}<div class="hero"><div style="font-size:13px;opacity:.8">Balance</div><div class="big">${bal<0?'-':''}${money(bal)}</div><div class="row" style="gap:8px;margin-top:10px"><div class="hs"><span class="cr">↓</span> Money in<b class="cr">${money(cr)}</b></div><div class="hs"><span class="db">↑</span> Money out<b class="db">${money(db)}</b></div></div></div>${alertsRow()}${forecastCard()}<div class="card"><h3 style="margin-bottom:10px">Where it went</h3>${db?donut(byCat(a),db):'<div class="mu">No spending yet this month 👀</div>'}</div><div class="card"><div class="row sp"><h3>Today</h3><button class="pill" onclick="setTab('all')">See all ›</button></div>${today.length?today.map(t=>entRow(t,1)).join(''):'<div class="mu" style="padding-top:8px">Nothing logged today. Tap + or 🎤</div>'}</div>`}
function calendar(){const y=M.getFullYear(),m=M.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),a=S.tx.filter(t=>inM(t,M));let h=`${monthBar()}<div class="cal mu" style="margin-bottom:6px">${'SMTWTFS'.split('').map(d=>`<div>${d}</div>`).join('')}</div><div class="cal">`;for(let i=0;i<first;i++)h+='<div class="d e"></div>';for(let d=1;d<=n;d++){const k=dkey(new Date(y,m,d)),net=a.filter(t=>dkey(new Date(t.ts))===k).reduce((s,t)=>s+(t.type==='cr'?t.amt:-t.amt),0),has=a.some(t=>dkey(new Date(t.ts))===k);h+=`<button class="d ${k===dkey(new Date())?'today':''}" onclick="dayList('${k}')">${d}${has?`<small class="${net>=0?'cr':'db'}">${net>=0?'+':'-'}${compact(net)}</small>`:''}</button>`}return h+'</div>'}
const km=n=>S.cur+compact(n),fdt=k=>new Date(k+'T00:00').toLocaleDateString('en',{day:'numeric',month:'short'});

<script id="smsmod">
(function(){
const AM=/(?:rs\.?|inr|₹)\s*([\d,]+(?:\.\d+)?)/i,BL=/\bbal(?:ance)?\b\.?\s*(?:is|:)?\s*(?:rs\.?|inr|₹)?\s*(-?[\d,]+(?:\.\d+)?)/i,
DK=['debited','withdrawn','to transfer','purchase','spent','deducted','paid to'],CK=['credited','by transfer','deposited','received','refund','reversed'],
at=(l,a)=>Math.min(...a.map(k=>{const i=l.indexOf(k);return i<0?1e9:i})),NUM=s=>parseFloat(String(s).replace(/,/g,'')),
hs=s=>{let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return h.toString(36)+s.length},
P=()=>{const C=window.Capacitor;if(!C)return;return P.c||(P.c=(C.Plugins&&C.Plugins.BankSms)||(C.isNativePlatform&&C.isNativePlatform()&&C.registerPlugin?C.registerPlugin('BankSms'):undefined))};
function merch(t,type){const bad=/^(a\/c|account|acct|your|you|card|bank|self|transfer|the|vpa)\b/i,v=t.match(/\bVPA\s+([\w.\-]+)@/i);
const re=new RegExp('\\b(?:'+(type==='db'?'at|to|towards':'from|by')+')\\s+([A-Za-z][A-Za-z0-9&.\' -]{2,30}?)(?=\\s+(?:on|via|ref|upi|bal|avl|available|using|vpa|txn|info)\\b|[.,;]|$)','gi');let m;
while((m=re.exec(t))){const n=m[1].trim();if(!bad.test(n))return n.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase())}
return v?v[1]:''}
function parse(raw,rcv){
const t=String(raw||'').replace(/\s+/g,' ').trim(),l=t.toLowerCase();
if(/\botp\b|one.?time pass|\bpin\b/.test(l)||(/failed|declined|unsuccessful/.test(l)&&!/revers|refund/.test(l)))return null;
if(!/a\/c|account|acct|card/.test(l))return null;

const dm=t.match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})/),tm=t.match(/\b(\d{1,2}):(\d{2})(?::(\d{2}))?/);

if(dm){let y=+dm[3];if(y<100)y+=2000;const n=new Date(y,dm[2]-1,+dm[1],tm?+tm[1]:12,tm?+tm[2]:0,tm&&tm[3]?+tm[3]:0).getTime();

const ac=(t.match(/(?:a\/c|account|acct|card)\b[^\d]{0,20}?\d*?(\d{4})\b/i)||[])[1]||'',rf=t.match(/ref\.?\s*(?:no\.?)?\s*:?\s*(\d{6,})/i),to=t.match(/credited to a\/c(?: no\.?)? [xX*]*(\d{4})/i),inf=t.match(/info:?\s*(.+?)\.?$/i);

if(inf)reason=inf[1].replace(/\b[A-Z]{4}0\w{6}\b/g,'').replace(/\d{6,}/g,'').replace(/\b(jrgb|jgb)\b\.?/ig,'').replace(/\s+/g,' ').trim()||reason;
else if(to)reason='UPI to a/c ..'+to[1];

return{type,amt:NUM(am[1]),ts,ac,kind:(tm||bm)?'T':'U',ref:rf?rf[1]:'',bal:bm?NUM(bm[1]):null,reason,pm:/upi/.test(l)?'UPI':'Bank'}}
function add(raw,rcv){
const p=parse(raw,rcv);if(!p)return'skip';
const m=S.sms=S.sms||{seen:{},bal:null},h=hs(String(raw).toLowerCase().replace(/[^a-z0-9]/g,''));

if(p.type==='db'){const e=Object.entries(KW).find(([n,w])=>w.split(' ').some(x=>lw.includes(' '+x)));if(e&&CATS.some(x=>x[0]===e[0]))c=e[0]}
S.tx.push({id:uid(),type:p.type,amt:p.amt,cat:c,reason:p.reason,ts:p.ts,pm:p.pm,sms:1,ac:p.ac,sk:[p.kind],ref:p.ref,bal:p.bal});return'new'}

})();
